name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --no-default-groups --group dev
      - run: uv run --frozen --no-default-groups --group dev pytest -q
      - run: uv run --frozen --no-default-groups --group dev ruff check relic experiments tests
