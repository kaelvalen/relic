name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The live-learning tests import transformers through the sandbox harness.
      # Select dev + lm explicitly: a plain sync would also install the ptm and
      # experiments default groups, which this job does not need.
      - run: uv sync --frozen --no-default-groups --group dev --group lm
      - run: uv run --frozen --no-default-groups --group dev --group lm pytest -q
